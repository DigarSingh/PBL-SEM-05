# Base configuration shared by all profiles. Secrets are never defined here:
# they come from environment variables (see .env.example at the repository root).
spring:
  application:
    name: shopsmart-backend
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/shopsmart?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DATABASE_USERNAME:shopsmart}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: shopsmart-db
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
        order_updates: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    deserialization:
      # Jackson 3 rejects absent primitives by default; optional request flags default to false instead.
      fail-on-null-for-primitives: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* only from internal proxies (e.g. the Nginx container).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    connection-timeout: 20s
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  health:
    # An SMTP outage must not mark the whole application as down.
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ShopSmart
    description: E-commerce & order management platform

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
    persist-authorization: true
    tags-sorter: alpha
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.shopsmart: INFO

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Required. At least 32 random characters, e.g. `openssl rand -base64 48`.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    issuer: shopsmart
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    max-failed-logins: 5
    lockout-duration: 15m
    email-verification-ttl: 24h
    password-reset-ttl: 30m
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: https://api.razorpay.com/v1
    connect-timeout: 5s
    read-timeout: 15s
  ai:
    enabled: ${AI_SERVICE_ENABLED:true}
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 1s
    read-timeout: 3s
  mail:
    from: ${MAIL_FROM:no-reply@shopsmart.example}
    from-name: ShopSmart
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-url-prefix: /uploads
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: 10
    api-requests-per-minute: 300
  seed:
    enabled: false
    admin-email: ${SEED_ADMIN_EMAIL:admin@shopsmart.test}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    customer-password: ${SEED_CUSTOMER_PASSWORD:}
  jobs:
    enabled: true
    pending-payment-check-interval: 5m
