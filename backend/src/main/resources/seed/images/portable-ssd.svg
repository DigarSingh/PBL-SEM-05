<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Portable SSD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="rotate(8 400 400)" filter="url(#s)">
    <rect x="215" y="260" width="370" height="280" rx="34" fill="url(#body)"/>
    <rect x="215" y="260" width="370" height="60" rx="30" fill="#ffffff" fill-opacity="0.08"/>
    <text x="400" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#e0e7ff">1 TB</text>
    <text x="400" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c7d2fe">NVMe · 1050 MB/s</text>
    <rect x="540" y="386" width="45" height="28" rx="8" fill="#1e1b4b"/>
  </g>
</svg>
