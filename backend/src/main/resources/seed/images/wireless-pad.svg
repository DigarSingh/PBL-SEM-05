<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Wireless charging pad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <radialGradient id="pad" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#14532d" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#s)">
    <ellipse cx="400" cy="420" rx="230" ry="120" fill="#020617"/>
    <ellipse cx="400" cy="400" rx="230" ry="120" fill="url(#pad)"/>
    <ellipse cx="400" cy="398" rx="150" ry="76" fill="none" stroke="#475569" stroke-width="4"/>
    <ellipse cx="400" cy="398" rx="36" ry="18" fill="none" stroke="#4ade80" stroke-width="5"/>
