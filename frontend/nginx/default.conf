upstream shopsmart_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Product image uploads (the backend itself caps a request at 25 MB).
    client_max_body_size 26m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Service-to-service and operational endpoints are never exposed through the public proxy.
    location /internal/ { return 404; }
    location /actuator/ { return 404; }

    location /api/ {
        proxy_pass http://shopsmart_backend;
	proxy_set_header Host localhost:8080;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://shopsmart_backend;
	proxy_set_header Host localhost:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /uploads/ {
        proxy_pass http://shopsmart_backend;
	proxy_set_header Host localhost:8080;
        proxy_set_header Connection "";
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html, which is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
