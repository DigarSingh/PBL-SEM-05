# Included in every location that sets its own headers (nginx does not inherit add_header then).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
# Razorpay Checkout loads its script from checkout.razorpay.com and runs in an api.razorpay.com
# frame. Product images may be uploads (same origin) or https links added by staff.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws://$host wss://$host https://*.razorpay.com; frame-src https://*.razorpay.com; frame-ancestors 'none'; form-action 'self' https://*.razorpay.com; base-uri 'self'; object-src 'none'" always;
