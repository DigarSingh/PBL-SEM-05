[project]
name = "shopsmart-ai-service"
version = "1.0.0"
description = "Semantic search ranking, recommendations and demand forecasting for ShopSmart"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
